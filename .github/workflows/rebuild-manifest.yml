name: Rebuild image manifest

on:
  push:
    paths:
      - 'images/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild images/manifest.json
        run: |
          node -e "
          const fs = require('fs'), path = require('path');
          const ok = f => /\.(jpe?g|png|webp|avif)\$/i.test(f);
          const walk = (dir, base = '') => fs.readdirSync(dir, { withFileTypes: true })
            .sort((a, b) => a.name.localeCompare(b.name))
            .flatMap(e => {
              if (e.name.startsWith('.')) return [];
              const rel = base ? base + '/' + e.name : e.name;
              if (e.isDirectory()) return walk(path.join(dir, e.name), rel);
              return ok(e.name) ? [rel] : [];
            });
          const files = fs.existsSync('images') ? walk('images') : [];
          fs.writeFileSync('images/manifest.json', JSON.stringify(files, null, 1) + '\n');
          console.log('manifest: ' + files.length + ' images');
          "

      - name: Commit if changed
        run: |
          git config user.name  "manifest bot"
          git config user.email "actions@github.com"
          git add images/manifest.json
          git diff --staged --quiet || git commit -m "rebuild image manifest"
          git push
